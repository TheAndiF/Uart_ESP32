[platformio]
default_envs = uart_esp32_usb

[env]
platform = espressif32
framework = arduino
board = nodemcu-32s
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    knolleary/PubSubClient

[env:uart_esp32_usb]
upload_protocol = esptool
upload_speed = 921600

; Nach dem ersten USB-Flash kann OTA benutzt werden.
; upload_port und Passwort an die eigenen Einstellungen anpassen.
[env:uart_esp32_ota]
upload_protocol = espota
upload_port = uart-esp32.local
upload_flags =
    --port=3232
    --auth=ota123
    --timeout=60
